<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="普通 AI 输出与中文技能库输出对比">
  <rect width="1200" height="780" fill="#FBF9F4"/>
  <text x="600" y="64" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#1F1D1A">同样一份会议记录，输出差在哪？</text>
  <text x="600" y="100" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8A8378">普通 AI 是复述，技能库是交付 —— 差一个「输出工程化」</text>
  <g>
    <rect x="60" y="140" width="480" height="490" rx="16" fill="#EFE9DF"/>
    <rect x="60" y="140" width="480" height="56" rx="16" fill="#5A5348"/>
    <rect x="60" y="180" width="480" height="16" fill="#5A5348"/>
    <circle cx="96" cy="168" r="10" fill="none" stroke="#F7F3EC" stroke-width="3"/>
    <line x1="91" y1="168" x2="101" y2="168" stroke="#F7F3EC" stroke-width="3"/>
    <text x="120" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#F7F3EC">普通 AI 输出</text>
    <text x="90" y="224" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="#8A8378">一段复述，重点自己找，格式全无</text>
    <text x="90" y="278" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" fill="#5A5348">会议讨论了内容排期。</text>
    <text x="90" y="314" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" fill="#5A5348">小王说公众号可以每周三篇，小红书两天一篇。</text>
    <text x="90" y="350" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" fill="#5A5348">李姐问预算，广告投放剩两万。主持人决定</text>
    <text x="90" y="386" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei", sans-serif" font-size="15" fill="#5A5348">公众号每周三篇、小红书每周两篇，投放两万。</text>
    <text x="90" y="422" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" fill="#5A5348">小王周五前发排期表。这周目标是排期定稿。</text>
    <rect x="90" y="540" width="420" height="52" rx="10" fill="#E2D9C8"/>
    <text x="300" y="574" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#B3402E">要点、决议、负责人全靠自己找</text>
  </g>
  <circle cx="600" cy="385" r="34" fill="#1F1D1A"/>
  <text x="600" y="393" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#F7F3EC">VS</text>
  <g>
    <rect x="660" y="140" width="480" height="490" rx="16" fill="#FFFFFF" stroke="#E4DAC8" stroke-width="1.5"/>
    <rect x="660" y="140" width="480" height="56" rx="16" fill="#B3402E"/>
    <rect x="660" y="180" width="480" height="16" fill="#B3402E"/>
    <path d="M688 168 L694 176 L712 156" fill="none" stroke="#F7F3EC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="724" y="176" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#F7F3EC">zhskills 结构化纪要</text>
    <text x="690" y="226" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei", sans-serif" font-size="14.5" fill="#8A8378">决议可执行 · 行动项可跟踪 · 风险可见</text>
    <text x="690" y="272" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#1F1D1A">一句话摘要</text>
    <text x="690" y="300" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" fill="#5A5348">确定下月排期：公众号每周 3 篇、</text>
    <text x="690" y="324" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" fill="#5A5348">小红书每周 2 篇，预算 2 万元。</text>
    <text x="690" y="370" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#1F1D1A">决议</text>
    <rect x="690" y="384" width="128" height="40" rx="9" fill="#F3EEE4"/>
    <text x="754" y="410" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5A5348">公众号每周 3 篇</text>
    <rect x="826" y="384" width="128" height="40" rx="9" fill="#F3EEE4"/>
    <text x="890" y="410" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5A5348">小红书每周 2 篇</text>
    <rect x="962" y="384" width="128" height="40" rx="9" fill="#F3EEE4"/>
    <text x="1026" y="410" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5A5348">投放预算 2 万元</text>
    <text x="690" y="472" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#1F1D1A">行动项（负责人 + 截止时间）</text>
    <rect x="690" y="488" width="420" height="38" rx="9" fill="#F6F2EA" stroke="#E4DAC8"/>
    <text x="706" y="513" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#5A5348">输出下月排期表并发布 ｜ 小王 ｜ 周五前</text>
    <text x="690" y="580" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#1F1D1A">风险提示</text>
    <text x="690" y="608" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" fill="#B3402E">⚠ 2 万元预算覆盖度待财务复核（待确认）</text>
  </g>
  <rect x="360" y="668" width="480" height="56" rx="28" fill="#1F1D1A"/>
  <text x="600" y="702" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#F7F3EC">打开就能用 · 改改就能发</text>
</svg>
